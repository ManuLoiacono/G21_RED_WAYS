<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marswalk — Gale</title>
    <style>
      html, body, #cesiumContainer { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #hud { position: absolute; top: 12px; left: 12px; z-index: 10; display: flex; gap: 6px; font: 13px system-ui, sans-serif; }
      #hud button { background: #1b1b1f; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
      #hud button.active { border-color: #3ff0ff; color: #3ff0ff; }
    </style>
  </head>
  <body>
    <div id="cesiumContainer"></div>
    <div id="hud">
      <button data-preset="liviano">Liviano</button>
      <button data-preset="equilibrado" class="active">Equilibrado</button>
      <button data-preset="presentacion">Presentación</button>
      <button id="resetView">Restablecer vista</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
