<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marswalk — Gale</title>
    <style>
      /* overflow: clip keeps focus from scrolling the page when a panel does not fit. */
      html, body, #cesiumContainer { margin: 0; width: 100%; height: 100%; overflow: clip; background: #000; }
      #hud { position: absolute; top: 12px; left: 12px; z-index: 10; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 24px); font: 13px system-ui, sans-serif; }
      #hud button { background: #1b1b1f; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
      #hud button.active { border-color: #3ff0ff; color: #3ff0ff; }
    </style>
  </head>
  <body>
    <!-- Texts are filled in from src/i18n (data-i18n*); the ones here are only a fallback. -->
    <div id="cesiumContainer"></div>
    <div id="hud">
      <button data-preset="light" data-i18n="hud.preset.light">Liviano</button>
      <button data-preset="balanced" class="active" data-i18n="hud.preset.balanced">Equilibrado</button>
      <button data-preset="presentation" data-i18n="hud.preset.presentation">Presentación</button>
      <button id="resetView" data-i18n="hud.resetView">Restablecer vista</button>
      <button id="toggleHirise" class="active" aria-pressed="true" hidden data-i18n="hud.hirise" data-i18n-title="hud.hirise.title">Detalle HiRISE 1 m</button>
      <button id="hiriseInfo" hidden data-source="hirise_mesh" data-i18n-aria="hud.hiriseInfo.aria" data-i18n-title="hud.hiriseInfo.title">ⓘ</button>
      <button data-source="visual_terrain" data-i18n-aria="hud.terrainInfo.aria" data-i18n-title="hud.terrainInfo.title">ⓘ</button>
      <button id="openSources" aria-haspopup="dialog" data-i18n="hud.sources">Fuentes</button>
      <button id="toggleLanguage" data-i18n="hud.language" data-i18n-aria="hud.language.aria">English</button>
    </div>
    <aside id="missionPanel" data-i18n-aria="aside.mission"></aside>
    <aside id="resultsPanel" data-i18n-aria="aside.results" hidden></aside>
    <dialog id="sourcesDialog"></dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
